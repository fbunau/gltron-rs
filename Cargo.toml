[package]
name = "gltron"
version = "0.1.0"
edition = "2024"
license = "GPL-2.0-or-later"

[dependencies]
winit = "0.30"
glow = "0.16"
glam = "0.29"
image = { version = "0.25", default-features = false, features = ["png"] }
tobj = "4"
rand = "0.9"
cpal = { version = "0.15", features = ["wasm-bindgen"] }
hound = "3.5"
lewton = "0.10"
web-time = "1"
log = "0.4"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
glutin = "0.32"
glutin-winit = "0.5"
raw-window-handle = "0.6"
gilrs = "0.11"

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"
js-sys = "0.3"
console_log = "1"
console_error_panic_hook = "0.1"
getrandom = { version = "0.3", features = ["wasm_js"] }

[target.'cfg(target_arch = "wasm32")'.dependencies.web-sys]
version = "0.3"
features = [
    "Window", "Document", "HtmlCanvasElement", "Element",
    "WebGl2RenderingContext", "WebGlContextAttributes",
    "Storage",
    "Navigator", "Gamepad", "GamepadButton",
]

[profile.release]
opt-level = 2
